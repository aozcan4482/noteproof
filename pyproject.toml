# NOTEPROOF-FILE
# module:   (repo kökü)
# owner:    burak           second: arda
# story:    -
# contract: 02#1 bağımlılık grupları
# depends:  -
# status:   wip

# Paketlerin kurulabilmesi için (pip install -e .) derleme sistemi tanımı.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "noteproof"
version = "0.0.1"
description = "Bitcoin timestamps and an AI-tagged knowledge graph for students' lecture notes"
readme = "README.md"
requires-python = ">=3.11"
# Ortak bağımlılık yok: anchor/, copywarn/ ve evalset/ yalnızca standart kütüphaneyi kullanır (03 bölüm 5).
dependencies = []

# Modül grupları (02 bölüm 1). Kurulum: pip install -e ".[dev,all]"
# NP-TODO(arda): Liste 02 bölüm 1'deki yığından türetildi; bağımlılık listesini onaylaman gerekiyor.
# Yeni kütüphane gerekirse bu dosyayı kendi branch'inde değiştirme; 04 bölüm 8'deki ortak dosya talebini kullan.
[project.optional-dependencies]
dev = ["pytest>=8"]
# Kayıt servisi ve HTTP API (Arda): FastAPI + uvicorn, dosya yükleme için python-multipart, grafik deposu.
register = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9", "rdflib>=7.0", "pyoxigraph>=0.4", "pyshacl>=0.26"]
# Ontoloji, SKOS sözlüğü ve SHACL (Eylem).
ontology = ["rdflib>=7.0", "pyshacl>=0.26"]
# AI tagger (Aleyna): PDF ve fotoğraftan metin çıkarma. Dil modeli sağlayıcısı K-005 ile seçilince eklenecek.
tagger = ["pypdf>=4.0", "pytesseract>=0.3.10", "Pillow>=10.0"]
# Arama servisi (Erdener): SPARQL için Oxigraph, router için FastAPI.
search = ["pyoxigraph>=0.4", "rdflib>=7.0", "fastapi>=0.110"]
all = ["noteproof[register,ontology,tagger,search]"]

# Repo kökünde birden çok paket olduğu için otomatik keşif çalışmaz ("Multiple top-level packages" hatası).
# Paketler burada açıkça yazılır; main'e yeni bir üst klasör paketi girdiğinde (core, register, ontology,
# shapes, search) bu listeye de eklenir (02 bölüm 1).
[tool.setuptools]
packages = ["anchor", "copywarn", "evalset", "tagger"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Testler paketi kurmadan da, repo kökünden "anchor" gibi içe aktarabilsin.
pythonpath = ["."]
markers = [
    "regtest: yerel bir bitcoind gerektirir; bitcoind yoksa otomatik atlanır",
]
