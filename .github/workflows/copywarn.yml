# Kopya uyarısı ve değerlendirme seti (S6).
# DoD: "The AI tagger and copy warning meet their targets — the 60-note evaluation set, run in CI".
# Genel test/regtest workflow'u Burak'ın (Ops); bu dosya yalnızca copywarn/ ve evalset/ için.
name: copywarn

on:
  push:
    paths: ["copywarn/**", "evalset/**", "tests/copywarn/**", ".github/workflows/copywarn.yml"]
  pull_request:
    paths: ["copywarn/**", "evalset/**", "tests/copywarn/**", ".github/workflows/copywarn.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # ontology grubu: manifest testi konu kimliklerini Eylem'in sözlüğüne (rdflib) karşı denetler (EMN-2).
      - run: pip install -e ".[dev,ontology]"
      - name: Birim testleri ve manifest denetimi
        run: python -m pytest -q tests/copywarn
      # Ölçüm, 20 planted copy üretildikten sonra çalışır (EMN-3). Notlar toplanırken manifest dolar ama
      # planted/planted.csv henüz yoktur; o aşamada ölçüm atlanır, CI kırmızıya dönmez.
      - name: Değerlendirme seti (planted copy'ler üretilince)
        run: |
          if [ ! -s evalset/planted/planted.csv ] || [ "$(tail -n +2 evalset/planted/planted.csv | grep -c .)" -eq 0 ]; then
            echo "::notice::planted copy'ler henüz üretilmedi (EMN-3) — değerlendirme atlandı"
          else
            python -m evalset.run_copywarn --json copywarn-report.json
          fi
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('copywarn-report.json') != ''
        with:
          name: copywarn-report
          path: copywarn-report.json
