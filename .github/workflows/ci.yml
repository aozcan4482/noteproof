# NOTEPROOF-FILE
# module:   .github
# owner:    burak           second: arda
# story:    S1, S2, S3, S5, S6, S7
# contract: 01#8 Definition of Done (1. madde: bütün testler CI'da geçer)
# depends:  -
# status:   wip
#
# Genel CI (BRK-2): her push'ta ve her PR'da bütün Python testleri ve tarayıcı testleri.
# - Python 3.12, bağımlılıklar pyproject.toml'daki gruplardan: pip install -e ".[dev,all]"
# - Bitcoin Core regtest testi (tests/anchor/test_regtest.py) burada ATLANMADAN çalışır; atlanırsa iş kırmızı olur.
# - tests/web/ varsa repo kökünde `node --test` (Node 22 ve üstü klasör argümanını kabul etmez, 03 bölüm 8).
# - Tesseract (tur + eng): tagger/'ın fotoğraf ve taranmış PDF OCR testleri atlanmasın (Aleyna'nın talebi, #17).
# - tagger-eval (ayrı iş): AI tagger ölçümü (O3) gerçek dil modeliyle; Groq anahtarı yalnızca bu işte (K-005).
# Sır kullanılmaz: signet cüzdanı CI'da yoktur; yalnızca regtest ve sahte node (burak.md, tasarım notları).
# copywarn.yml (Emine) ayrı kalır; kopya uyarısının değerlendirme setini o çalıştırır.
name: ci

on:
  push:
  pull_request:
  # Tagger ölçümünü elle başlatmak için (Actions → ci → Run workflow).
  workflow_dispatch:

permissions:
  contents: read

env:
  # Bitcoin Core sürümü ve resmî SHA256SUMS dosyasındaki hash'i. Sürüm değişirse ikisi birlikte değişir.
  BITCOIN_VERSION: "32.1"
  BITCOIN_SHA256: "61545c17c3120fb7412f896d248b11993af04ec8817aad3649c55b2afb044963"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          # requirements.txt yok; önbellek anahtarı bağımlılıkların tanımlı olduğu dosyadan üretilir.
          cache-dependency-path: pyproject.toml

      - name: Python bağımlılıkları
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,all]"

      # OCR (02 bölüm 1: "Tesseract + pytesseract"). tagger/ Türkçe ve İngilizce dil verisiyle okur (tur+eng).
      - name: Tesseract (OCR, tur+eng)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-tur tesseract-ocr-eng
          tesseract --version | head -1
          tesseract --list-langs

      # Bitcoin Core ikili dosyaları; her çalışmada yeniden indirmemek için önbellekte tutulur.
      - name: Bitcoin Core önbelleği
        id: bitcoin-cache
        uses: actions/cache@v4
        with:
          path: ~/bitcoin
          key: bitcoin-${{ env.BITCOIN_VERSION }}-${{ env.BITCOIN_SHA256 }}

      - name: Bitcoin Core indir ve doğrula
        if: steps.bitcoin-cache.outputs.cache-hit != 'true'
        run: |
          file="bitcoin-${BITCOIN_VERSION}-x86_64-linux-gnu.tar.gz"
          curl -fsSL -o "$file" "https://bitcoincore.org/bin/bitcoin-core-${BITCOIN_VERSION}/${file}"
          # Hash eşleşmezse iş burada durur; değiştirilmiş bir dosya hiç çalıştırılmaz.
          echo "${BITCOIN_SHA256}  ${file}" | sha256sum -c -
          mkdir -p ~/bitcoin
          tar -xzf "$file" -C ~/bitcoin --strip-components=1

      - name: bitcoind'yi PATH'e ekle
        run: |
          echo "$HOME/bitcoin/bin" >> "$GITHUB_PATH"

      - name: bitcoind sürümü
        run: bitcoind -version | head -1

      - name: Python testleri
        run: python -m pytest -q -rs

      # Kabul ölçütü (BRK-2): regtest testi CI'da atlanmadan geçer. Atlanırsa ya da çalışmazsa iş kırmızı olur.
      # Yalnızca regtest dosyası çalıştırılır: başka bir modülün atlanan testi (ör. eksik bağımlılık) bu
      # kontrolü yanlışlıkla kırmızıya düşürmesin (#41'de oldu). Dosyadaki her test geçmeli, hiçbiri atlanmamalı.
      - name: Regtest testi atlanmadı mı
        run: |
          out="$(python -m pytest -q -rs tests/anchor/test_regtest.py 2>&1)" || { echo "$out"; echo "::error::regtest testi geçmedi"; exit 1; }
          echo "$out"
          last="$(echo "$out" | tail -1)"
          echo "$last" | grep -q "passed" || { echo "::error::regtest testi çalışmadı"; exit 1; }
          if echo "$last" | grep -q "skipped"; then
            echo "::error::regtest testi atlandı; bitcoind bulunamadı"; exit 1
          fi

      - uses: actions/setup-node@v4
        if: hashFiles('tests/web/**/*.test.mjs') != ''
        with:
          node-version: "22"

      - name: Tarayıcı testleri (node --test)
        if: hashFiles('tests/web/**/*.test.mjs') != ''
        run: node --test

  # AI tagger ölçümü (O3, Aleyna'nın talebi, #47): değerlendirme setindeki notlar için gerçek dil modeliyle öneri alır
  # ve bilinen konularla karşılaştırır. Ayrı iş olmasının nedeni: Groq anahtarı (K-005) yalnızca burada görünür,
  # test adımları onu hiç görmez (testler FakeLLM ile çalışır, 03 bölüm 8).
  # Yalnızca main'e push'ta ve elle başlatıldığında çalışır: her PR'da gerçek API çağrısı yapıp ücretsiz kotayı
  # harcamamak için. Anahtar yoksa betik "atlandı" deyip 0 ile çıkar; hedefin (%80) altındaysa 1 ile çıkar.
  tagger-eval:
    needs: test
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Python bağımlılıkları
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,all]"

      - name: Tagger ölçümü (O3)
        # run_tagger.py main'e girmeden (#47) bu adım atlanır; iş yeşil kalır.
        if: hashFiles('evalset/run_tagger.py') != ''
        env:
          NOTEPROOF_LLM_PROVIDER: groq
          NOTEPROOF_LLM_MODEL: openai/gpt-oss-20b
          NOTEPROOF_LLM_API_KEY: ${{ secrets.NOTEPROOF_LLM_API_KEY }}
        run: python -m evalset.run_tagger --json tagger-report.json

      # Rapor yalnızca not kimlikleri, konu kimlikleri ve sayılar içerir (not metni ve anahtar yok, #47).
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('tagger-report.json') != ''
        with:
          name: tagger-report
          path: tagger-report.json
